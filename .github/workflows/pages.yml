# GitHub Pages へ静的ファイルだけをデプロイする。
# 公開先: https://apps.harusame.tech/aogiri-hs-card-gen/
# （カスタムドメインはユーザーページ用リポジトリ <username>.github.io 側で設定する。
#   このリポジトリには CNAME ファイルを置かず、Pages 設定の Custom domain も空のままにする。
#   アセットはすべて相対パス参照なので、サブパスでもそのまま動く）
# テンプレート画像は含めない（利用者が各自で読み込む）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp aogiri-hs-card-gen/index.html aogiri-hs-card-gen/app.js aogiri-hs-card-gen/style.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
